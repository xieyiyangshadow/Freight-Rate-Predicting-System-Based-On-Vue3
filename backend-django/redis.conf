# Redis 配置文件 - 针对 Windows 优化

# 禁用所有持久化方式，避免 Windows 上的 fork 错误
save ""
appendonly no

# 基础配置
port 6379
bind 127.0.0.1
timeout 0
tcp-keepalive 300

# 日志
loglevel notice
logfile ""

# 数据库
databases 16
dbfilename dump.rdb
dir ./

# 内存管理
maxmemory-policy noeviction

# 客户端输出缓冲限制
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
